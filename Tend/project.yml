# XcodeGen spec for Tend.
#
# The Xcode project is generated rather than committed: a five-target project
# file is a merge-conflict machine, and a spec is reviewable in a way a
# .pbxproj is not.
#
#   brew install xcodegen
#   cd Tend && xcodegen generate && open Tend.xcodeproj
#
# Replace TEAMID and the bundle/container identifiers with your own before the
# first build — CloudKit will not provision against the placeholders.

name: Tend
options:
  bundleIdPrefix: com.tend
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: TEAMID
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  TendKit:
    path: TendKit

targets:

  # ---------------------------------------------------------------- main app
  Tend:
    type: application
    platform: iOS
    sources:
      - path: Apps/Tend
    dependencies:
      - package: TendKit
      - target: TendWidgets
        embed: true
      - target: TendShareExtension
        embed: true
      - target: TendWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tend.household
        INFOPLIST_FILE: Support/Tend-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Tend.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  # --------------------------------------------------------- widget extension
  TendWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/TendWidgets
    dependencies:
      - package: TendKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tend.household.widgets
        INFOPLIST_FILE: Support/TendWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/TendWidgets.entitlements

  # ---------------------------------------------------------- share extension
  TendShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/TendShareExtension
      # The extension needs the same on-device OCR the app uses; sharing the
      # one file is cheaper than a fourth framework target.
      - path: Apps/Tend/TextRecognizer.swift
    dependencies:
      - package: TendKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tend.household.share
        INFOPLIST_FILE: Support/TendShareExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/TendShareExtension.entitlements

  # ----------------------------------------------------------------- watch app
  TendWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/TendWatch
        excludes:
          - TendWatchComplications.swift
    dependencies:
      - package: TendKit
      - target: TendWatchComplications
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tend.household.watchkitapp
        INFOPLIST_FILE: Support/TendWatch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/TendWatch.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TendWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/TendWatch/TendWatchComplications.swift
    dependencies:
      - package: TendKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tend.household.watchkitapp.complications
        INFOPLIST_FILE: Support/TendWatchComplications-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/TendWatch.entitlements

  # ---------------------------------------------------------------- UI tests
  TendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TendUITests
    dependencies:
      - target: Tend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tend.household.uitests

schemes:
  Tend:
    build:
      targets:
        Tend: all
        TendWidgets: all
        TendShareExtension: all
        TendWatch: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TendUITests
      # TendKit's unit tests run through SwiftPM — `cd TendKit && swift test` —
      # which keeps the logic suite runnable without booting a simulator.
