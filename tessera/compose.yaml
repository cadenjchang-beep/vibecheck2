# Production on a single host: PostgreSQL, a one-off migration, then the app.
# Put HTTPS in front of port 8787 (a reverse proxy such as Caddy or nginx, or
# your platform's load balancer).
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose --env-file .env.production up -d --build
#
# Upgrades: pull the new code and run the same command; migrations run first.
name: tessera

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: tessera
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: tessera:${APP_VERSION:-latest}
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://tessera:${POSTGRES_PASSWORD}@db:5432/tessera
    command: ["node", "dist/server/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: tessera:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      PORT: "8787"
      DATABASE_URL: postgres://tessera:${POSTGRES_PASSWORD}@db:5432/tessera
    ports:
      - "${HOST_PORT:-8787}:8787"
    volumes:
      - app-data:/app/.data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
  app-data:
