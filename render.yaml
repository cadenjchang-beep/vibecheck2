# One-click deployment of the Tessera app (tessera/) on Render: the app and
# its own PostgreSQL database, created together. Owner mode: only the email
# address you enter for OWNER_EMAIL can sign up, and it gets Premium.
# See tessera/docs/DEPLOYMENT.md#render.
services:
  - type: web
    name: tessera
    runtime: docker
    rootDir: tessera
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OWNER_EMAIL
        sync: false # Render asks for your email address when you deploy
      - key: DATABASE_URL
        fromDatabase:
          name: tessera-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: MIGRATE_ON_START
        value: "1"
      - key: STORAGE_DRIVER
        value: database
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_POOL_MAX
        value: "5"

databases:
  - name: tessera-db
    plan: free
    postgresMajorVersion: "16"
